version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../results:/app/results

  reproduce:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    volumes:
      - ../results:/app/results
      - ../paper:/app/paper
    command: python scripts/reproduce.py

  paper:
    build:
      context: ..
      dockerfile: infra/Dockerfile.paper
    volumes:
      - ../paper:/work
